<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sign Up — Chess AI</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="stylesheet" href="style.css?v=1.1" />
</head>
<body>
    <div class="container screen active">
        <h1>Create Account</h1>
        <p class="subtitle">Sign up to play</p>
        <div class="form-group">
            <input type="text" id="username" placeholder="Username" autocomplete="off" />
        </div>
        <div class="form-group">
            <input type="password" id="password" placeholder="Password" />
        </div>
        <div class="auth-buttons">
            <button id="btn-signup" class="primary">Sign Up</button>
            <a href="index.html" style="text-align: center; color: #888; text-decoration: none; margin-top: 10px;">Already have an account? Login</a>
        </div>
        <p id="error-msg" style="display: none;"></p>
    </div>

    <script>
        if (localStorage.getItem('chess_user')) {
            window.location.href = 'game.html';
        }

        document.getElementById('btn-signup').addEventListener('click', async () => {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const err = document.getElementById('error-msg');
            
            if (!username || !password) {
                err.textContent = 'Please enter both username and password.';
                err.style.display = 'block';
                return;
            }

            let raw = '';
            try {
                const res = await fetch('signup.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                raw = await res.text();
                
                let data;
                try {
                    const jsonStart = raw.indexOf('{');
                    const jsonEnd = raw.lastIndexOf('}');
                    data = JSON.parse(jsonStart > -1 && jsonEnd > -1 ? raw.substring(jsonStart, jsonEnd + 1) : raw);
                } catch(e) {
                    throw new Error('Host blocked the request or returned invalid JSON.');
                }

                if (data.success) {
                    alert('Account created! Please log in.');
                    window.location.href = 'index.html';
                } else {
                    err.textContent = data.message;
                    err.style.display = 'block';
                }
            } catch (error) {
                err.innerHTML = 'Cannot connect to server. Error: ' + error.message;
                if (raw) {
                    err.innerHTML += '<br><br>Raw server response:<br><pre style="font-size:0.7rem;text-align:left;background:#111;padding:8px;border-radius:4px;max-height:200px;overflow:auto;">' + raw.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</pre>';
                }
                err.style.display = 'block';
            }
        });
    </script>
</body>
</html>
